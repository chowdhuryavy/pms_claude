# Pushes the Apps Script project with clasp, then publishes a new version of the
# existing web app deployment. Credentials come from repository secrets only.
name: Deploy Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'

permissions:
  contents: read

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install clasp
        run: npm install -g @google/clasp
      - name: Configure clasp from secrets
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON" && test -n "$APPS_SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"src"}' "$APPS_SCRIPT_ID" > apps-script/.clasp.json
      - name: Push source
        working-directory: apps-script
        run: clasp push --force
      - name: Publish a new version of the web app deployment
        if: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID != '' }}
        working-directory: apps-script
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
        run: clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "CI ${GITHUB_SHA::7}"
