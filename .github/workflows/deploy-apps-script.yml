# Apps Script updater.
#
# - Push to main (apps-script/** changed): uploads the code only. No new version is
#   created, so version slots are not used. The "Head" (/dev) URL shows the change at once.
# - Manual run with mode "release": uploads the code, then publishes a NEW version to the
#   existing web app deployment (/exec URL). Apps Script allows about 200 versions per
#   project, so release only when a batch of changes is ready.
#
# Secrets required (repository Settings > Secrets and variables > Actions):
#   CLASPRC_JSON                 contents of ~/.clasprc.json after `clasp login`
#   APPS_SCRIPT_ID               Apps Script project ID
#   APPS_SCRIPT_DEPLOYMENT_ID    the web app deployment ID (needed for release)
name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'push = code only (no version). release = code + new version on /exec'
        type: choice
        options: [push, release]
        default: push
      note:
        description: 'Short description of this version (release only)'
        required: false
        default: 'manual release'

permissions:
  contents: read

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check that deployment secrets exist
        id: check
        env:
          HAS_CLASPRC: ${{ secrets.CLASPRC_JSON != '' }}
          HAS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID != '' }}
        run: |
          if [ "$HAS_CLASPRC" = "true" ] && [ "$HAS_SCRIPT_ID" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Deployment secrets not set. Skipping. See docs/DEPLOYMENT.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20
      - name: Install clasp
        if: steps.check.outputs.ready == 'true'
        run: npm install -g @google/clasp
      - name: Configure clasp from secrets
        if: steps.check.outputs.ready == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC_JSON" && test -n "$APPS_SCRIPT_ID"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '{"scriptId":"%s","rootDir":"src"}' "$APPS_SCRIPT_ID" > apps-script/.clasp.json
      - name: Upload code (no version created)
        if: steps.check.outputs.ready == 'true'
        working-directory: apps-script
        run: clasp push --force
      - name: Publish new version to the web app deployment
        if: ${{ steps.check.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.mode == 'release' }}
        working-directory: apps-script
        env:
          DEPLOYMENT_ID: ${{ secrets.APPS_SCRIPT_DEPLOYMENT_ID }}
          NOTE: ${{ inputs.note }}
        run: |
          test -n "$DEPLOYMENT_ID"
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$NOTE (${GITHUB_SHA::7})"
